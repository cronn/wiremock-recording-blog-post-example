services:
  sample-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      OVERPASS_URL: https://overpass-api.de/api/interpreter

  e2e-tests:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    container_name: e2e-tests
    # Läuft mit der UID/GID des Host-Users, damit erzeugte Dateien nicht root gehören
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
    ports:
      - "8095:8095"
    ipc: host
    init: true
    working_dir: /e2e
    volumes:
      - ./e2e:/e2e
    command: [ "sh", "-c", "npm ci && npx playwright test --ui-port=8095 --ui-host=0.0.0.0" ]
    depends_on:
      sample-app:
        condition: service_healthy
